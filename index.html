<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CILIUTI 无限画布 · Community</title><link rel="stylesheet" href="canvas.css"><header><div class="brand">CILIUTI <b>无限画布</b></div><span class="crumb">/　镜头工作区</span><nav><button id="add" title="新增镜头">＋ 镜头</button><button id="export" title="导出项目 JSON">导出</button><label for="file">导入</label><input id="file" type="file" accept=".json,application/json" hidden></nav></header><main><section id="view" aria-label="可平移和缩放的节点画布"><div id="world"><svg id="wires" width="1" height="1" aria-hidden="true"></svg><div id="nodes"></div></div><div class="tools"><button id="out" aria-label="缩小">−</button><output id="scale">100%</output><button id="in" aria-label="放大">＋</button><button id="fit" title="还原视图">还原</button></div></section><aside><p class="tag">INSPECTOR</p><h1>节点属性</h1><label>节点名称<input id="name" maxlength="80"></label><label>类别<select id="kind"><option>简报</option><option>镜头</option><option>声音</option><option>剪辑</option></select></label><label>镜头笔记<textarea id="note" rows="4" maxlength="800"></textarea></label><label>连接到<select id="target"></select></label><button id="link">连接节点</button><button id="unlink">移除所选连线</button><button id="delete">删除节点</button><hr><p class="tag">PROJECT</p><output id="count"></output><p id="status" role="status"></p></aside></main><script type="module" src="canvas.mjs"></script></html>
